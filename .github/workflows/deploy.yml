name: Build and Deploy GeoRide

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: georide-deployment
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - context: ./api_service
            image: georide-api
          - context: ./location_service
            image: georide-location
          - context: ./matcher_service
            image: georide-matcher
          - context: ./driver_simulator
            image: georide-simulator

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}

  deploy:
    name: Deploy inside laptop VM
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Copy deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f /opt/georide/.env

          tar -cf - \
            docker-compose.yml \
            docker-compose.prod.yml \
            init.sql \
            nginx/nginx.conf \
            prometheus/prometheus.yml \
            loki/loki-config.yaml \
            loki/promtail-config.yml \
          | tar -xf - -C /opt/georide

          printf 'DOCKERHUB_USERNAME=%s\nIMAGE_TAG=%s\n' \
            "$DOCKERHUB_USERNAME" "$IMAGE_TAG" \
            > /opt/georide/images.env

      - name: Pull images and deploy
        shell: bash
        working-directory: /opt/georide
        run: |
          set -euo pipefail

          compose() {
            docker compose \
              --project-name georide \
              --env-file .env \
              --env-file images.env \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              "$@"
          }

          compose config --quiet
          compose pull

          if ! compose up -d --no-build --remove-orphans \
              --wait --wait-timeout 300; then
            compose ps -a
            compose logs --tail=100
            exit 1
          fi

          compose ps

      - name: Test API
        shell: bash
        run: |
          set -euo pipefail

          response=$(mktemp)
          trap 'rm -f "$response"' EXIT

          for attempt in $(seq 1 30); do
            code=$(curl -sS --max-time 10 \
              -o "$response" \
              -w '%{http_code}' \
              http://127.0.0.1/trip/2147483647 || true)

            if [ "$code" = "404" ] &&
               grep -q 'Trip not found' "$response"; then
              echo "API smoke test passed."
              exit 0
            fi

            sleep 5
          done

          echo "API smoke test failed."
          exit 1
